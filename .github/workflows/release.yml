name: Release

on:
  release:
    types:
      - published

jobs:
  publish-to-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build package
        run: npm run build

      - name: Derive package version from release tag
        shell: bash
        run: |
          TAG_NAME="${{ github.event.release.tag_name }}"

          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag '$TAG_NAME' is not a valid npm version tag. Expected format like v1.0.4 or v1.0.4-pre."
            exit 1
          fi

          PACKAGE_VERSION="${TAG_NAME#v}"
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> "$GITHUB_ENV"

      - name: Update package.json version for publish
        run: npm version ${{ env.PACKAGE_VERSION }} --no-git-tag-version

      - name: Publish prerelease package
        if: ${{ github.event.release.prerelease }}
        run: npm publish --access public --tag next
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish stable package
        if: ${{ !github.event.release.prerelease }}
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
